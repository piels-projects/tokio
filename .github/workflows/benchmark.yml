# Benchmark workflow for the tokio-rs/tokio fork.
#
# Workload: the COMPLETE "test-tokio-full" job from upstream
# .github/workflows/ci.yml (transcribed from upstream 2026-07-23 -- re-verify
# against the file at the pinned commit): stable toolchain, cargo-nextest,
# then `cargo nextest run --features full` plus doc tests in the tokio crate.
# One matrix leg is run: ubuntu. Nothing else is cut.
#
# See forks/vite/benchmark.yml for the conventions shared by all forks
# (runs-on mapping, "workload:" step-name prefix, cold/warm semantics).
# Warm cache = upstream's own mechanism, Swatinem/rust-cache (registry,
# git deps, and target/), restore+save guarded by cache_state.

name: benchmark
run-name: "bench ${{ inputs.environment }} ${{ inputs.cache_state }} ${{ inputs.batch_id }} ${{ inputs.run_key }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Runner environment under test
        type: choice
        required: true
        options: [github, github-8core, ec2, blacksmith]
      cache_state:
        description: cold = no caches, warm = upstream cache configuration
        type: choice
        required: true
        options: [cold, warm]
      batch_id:
        description: Collection batch this run belongs to
        type: string
        required: true
      run_key:
        description: Unique key set by the orchestrator to find this run via the API
        type: string
        required: true

permissions:
  contents: read

env:
  rust_stable: stable

jobs:
  benchmark:
    runs-on: ${{ fromJSON('{"github":"ubuntu-latest","github-8core":"benchmark-8core","ec2":"benchmark-ec2","blacksmith":"blacksmith-8vcpu-ubuntu-2404"}')[inputs.environment] }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Start telemetry
        uses: ./.github/actions/telemetry/start
        continue-on-error: true
        with:
          runner_label: ${{ inputs.environment }}

      # --- upstream "test-tokio-full" job steps, in upstream order ---

      - name: Install Rust ${{ env.rust_stable }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_stable }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Rust cache
        if: inputs.cache_state == 'warm'
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true

      # Run `tokio` with stable features. This excludes testing utilities
      # which can alter the runtime behavior of Tokio. (upstream comment)
      - name: "workload: test tokio full"
        run: |
          set -euxo pipefail
          cargo nextest run --features full
          cargo test --doc --features full
        working-directory: tokio

      - name: Stop telemetry
        if: always()
        uses: ./.github/actions/telemetry/stop
